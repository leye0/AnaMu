name: AnaMu - PIAST-AT musical surprise research (opt-in)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/piast-surprise-research.yml'
      - 'anamu/piast_expectation_hypothesis.py'
      - 'scripts/piast_surprise_experiment.py'

permissions:
  contents: read

jobs:
  midi-surprise-ablation:
    # Never spend hosted CI minutes on a routine edit. An explicit opt-in
    # commit tag (or manual dispatch) is needed to download 1400 MIDI files.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[piast-surprise-run]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install MIDI-only dependencies
        run: python -m pip install --quiet 'mido>=1.3,<2' 'partitura>=1.8,<2' 'music21>=9,<12' 'melody-features==1.3.3' 'scikit-learn>=1.5,<2'
      - name: Verify surprise features and group-leakage safeguards
        run: python -m unittest discover -s tests -p 'test_piast_expectation_hypothesis.py' -v
      - name: Download bounded PIAST-AT MIDI and annotation CSV from pinned revision
        run: python -m scripts.fetch_piast_at "$RUNNER_TEMP/piast" --limit 1400 --workers 6 > "$RUNNER_TEMP/piast-fetch-log.json"
      - name: Check download is complete before evaluating the held-out cohort
        run: |
          python -c 'import json,os,pathlib; d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"piast"/"fetch-manifest.json").read_text()); assert d["requested"] == d["downloaded_or_present"] == 1400 and not d["errors"], "Incomplete pinned dataset download"'
      - name: Measure four preregistered, identical-split held-out variants
        run: python -m scripts.piast_surprise_experiment "$RUNNER_TEMP/piast" --limit 1400 --fresh-after 850 --out "$RUNNER_TEMP/piast-research"
      - name: Preserve only analysis reports, never the downloaded MIDI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piast-musical-surprise-ablation
          path: |
            ${{ runner.temp }}/piast-research/*.json
            ${{ runner.temp }}/piast-research/*.md
            ${{ runner.temp }}/piast-fetch-log.json
          retention-days: 14
