name: P1 - audit instrumentation de 200 MIDI XMIDI

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/p1-instrument-audit.yml

permissions:
  contents: read

jobs:
  instruments:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - name: Installer le lecteur MIDI leger
        run: python -m pip install --quiet 'mido>=1.3,<2'
      - name: Tests unitaires sans reseau
        run: python -m unittest discover -s tests -v
      - name: Audit instrumental borne sans conserver les MIDI
        run: python -m scripts.audit_xmidi_instruments
