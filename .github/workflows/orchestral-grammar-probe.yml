name: Orchestral MIDI G0-G1 probe

on:
  push:
    paths:
      - 'anamu/grammar_foundation.py'
      - 'anamu/grammar_relations.py'
      - 'scripts/orchestral_grammar_probe.py'
      - 'tests/test_orchestral_grammar_probe.py'
      - 'data/orchestral/**'
      - '.github/workflows/orchestral-grammar-probe.yml'
  pull_request:
    paths:
      - 'anamu/grammar_foundation.py'
      - 'anamu/grammar_relations.py'
      - 'scripts/orchestral_grammar_probe.py'
      - 'tests/test_orchestral_grammar_probe.py'
      - 'data/orchestral/**'
      - '.github/workflows/orchestral-grammar-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'mido>=1.3,<2'
      - run: python -m unittest discover -s tests -p test_orchestral_grammar_probe.py -v
      - run: python scripts/orchestral_grammar_probe.py --output /tmp/orchestral-grammar-probe.json
      - name: Compare reproducible committed report
        run: cmp /tmp/orchestral-grammar-probe.json reports/orchestral-grammar-probe-2026-11-09.json
