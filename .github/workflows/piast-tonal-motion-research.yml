name: AnaMu - PIAST tonal trajectories (exploratory, opt-in)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/piast-tonal-motion-research.yml'
      - 'anamu/tonal_motion.py'
      - 'scripts/piast_tonal_motion_experiment.py'

permissions:
  contents: read

jobs:
  tonal-motion-hard-moods:
    # 1900-file downloading is expensive: never run on ordinary commits.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[piast-tonal-run]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install MIDI-only feature dependencies
        run: python -m pip install --quiet 'mido>=1.3,<2' 'partitura>=1.8,<2' 'music21>=9,<12' 'melody-features==1.3.3' 'scikit-learn>=1.5,<2'
      - name: Verify mode trajectory and order-control tests
        run: python -m unittest discover -s tests -p 'test_tonal_motion.py' -v
      - name: Download exactly matched, pinned 1900 PIAST-AT MIDI
        run: python -m scripts.fetch_piast_at "$RUNNER_TEMP/piast" --limit 1900 --workers 6 > "$RUNNER_TEMP/piast-fetch-log.json"
      - name: Refuse incomplete corpus
        run: |
          python -c 'import json,os,pathlib; d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"piast"/"fetch-manifest.json").read_text()); assert d["requested"] == d["downloaded_or_present"] == 1900 and not d["errors"], "Incomplete pinned dataset"'
      - name: Compare static, tonal sequence and shuffled window controls
        run: python -m scripts.piast_tonal_motion_experiment "$RUNNER_TEMP/piast" --out "$RUNNER_TEMP/piast-tonal"
      - name: Preserve derived scores only (no third-party MIDI)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piast-tonal-motion-ablation
          path: |
            ${{ runner.temp }}/piast-tonal/*.json
            ${{ runner.temp }}/piast-tonal/*.md
            ${{ runner.temp }}/piast-fetch-log.json
          retention-days: 14
