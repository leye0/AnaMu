name: P1 - en-tete CSV de provenance GigaMIDI

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/p1-csv-header.yml
      - scripts/probe_gigamidi_csv_header.py
      - tests/test_probe_gigamidi_csv_header.py

permissions:
  contents: read

jobs:
  header:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Tests sans reseau
        run: python -m unittest discover -s tests -v
      - name: Lire uniquement 8 Kio de l'en-tete CSV
        env:
          HF_TOKEN: ${{ secrets.HUGGING_FACE_KEY }}
        run: python scripts/probe_gigamidi_csv_header.py
