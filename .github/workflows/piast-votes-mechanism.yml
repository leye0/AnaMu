name: AnaMu - test of clip-specific vote-strength mechanism (opt-in)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/piast-votes-mechanism.yml'
      - 'scripts/piast_votes_mechanism.py'

permissions:
  contents: read

jobs:
  label-strength-placebo:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[piast-vote-mechanism-run]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install symbolic feature and logistic evaluation dependencies
        run: python -m pip install --quiet 'mido>=1.3,<2' 'partitura>=1.8,<2' 'music21>=9,<12' 'melody-features==1.3.3' 'scikit-learn>=1.5,<2'
      - name: Check within-class sham preserves hard labels and vote frequencies
        run: python -m unittest discover -s tests -p 'test*piast_votes_mechanism*.py' -v
      - name: Fetch pinned full PIAST data (no audio)
        run: python -m scripts.fetch_piast_at "$RUNNER_TEMP/piast" --limit 1900 --workers 6 > "$RUNNER_TEMP/piast-fetch-log.json"
      - name: Reject partial cohort
        run: |
          python -c 'import json,os,pathlib; d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"piast"/"fetch-manifest.json").read_text()); assert d["requested"] == d["downloaded_or_present"] == 1900 and not d["errors"], "Incomplete MIDI cohort"'
      - name: Compare true item votes with within-majority-class vote permutations
        run: python -m scripts.piast_votes_mechanism "$RUNNER_TEMP/piast" --out "$RUNNER_TEMP/vote-mechanism"
      - name: Upload aggregate metrics only, no copyrighted MIDI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piast-vote-mechanism-derived-metrics
          path: |
            ${{ runner.temp }}/vote-mechanism/*.json
            ${{ runner.temp }}/vote-mechanism/*.md
            ${{ runner.temp }}/piast-fetch-log.json
          retention-days: 14
