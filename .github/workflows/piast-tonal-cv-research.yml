name: AnaMu - PIAST tonal distribution versus temporal CV (opt-in)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/piast-tonal-cv-research.yml'
      - 'scripts/piast_tonal_cv.py'

permissions:
  contents: read

jobs:
  tonal-cv-hard-moods:
    # All 1900 MIDI downloads and hundreds of fits: only explicit opt-in.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[piast-tonal-cv-run]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install MIDI-only feature dependencies
        run: python -m pip install --quiet 'mido>=1.3,<2' 'partitura>=1.8,<2' 'music21>=9,<12' 'melody-features==1.3.3' 'scikit-learn>=1.5,<2'
      - name: Verify grouped evaluation, invariance and regression tests
        run: python -m unittest discover -s tests -p 'test*tonal*.py' -v
      - name: Download exact pinned cohort (1900 annotated symbolic MIDI)
        run: python -m scripts.fetch_piast_at "$RUNNER_TEMP/piast" --limit 1900 --workers 6 > "$RUNNER_TEMP/piast-fetch-log.json"
      - name: Refuse incomplete dataset
        run: |
          python -c 'import json,os,pathlib; d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"piast"/"fetch-manifest.json").read_text()); assert d["requested"] == d["downloaded_or_present"] == 1900 and not d["errors"], "Incomplete pinned cohort"'
      - name: Compare distribution, sequence, permutation and tag controls
        run: python -m scripts.piast_tonal_cv "$RUNNER_TEMP/piast" --out "$RUNNER_TEMP/piast-tonal-cv"
      - name: Keep derived metrics only; never upload MIDI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piast-tonal-cv-derived-metrics
          path: |
            ${{ runner.temp }}/piast-tonal-cv/*.json
            ${{ runner.temp }}/piast-tonal-cv/*.md
            ${{ runner.temp }}/piast-fetch-log.json
          retention-days: 14
