name: P0 - inspecter schema GigaMIDI

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/p0-gigamidi-schema.yml
      - scripts/probe_gigamidi_schema.py
      - tests/test_probe_gigamidi_schema.py

permissions:
  contents: read

jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Tests sans reseau
        run: python -m unittest discover -s tests -v
      - name: Lire un schema limite a 1 ligne et 400 kB
        env:
          HF_TOKEN: ${{ secrets.HUGGING_FACE_KEY }}
        run: python scripts/probe_gigamidi_schema.py
