name: AnaMu - published tonal tension ribbons vs PIAST hard moods (opt-in)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/piast-ribbon-research.yml'
      - 'scripts/piast_ribbon_experiment.py'

permissions:
  contents: read

jobs:
  ribbons-hard-moods:
    # Pinned 1900 MIDI and 5*14*5 fits; intentional opt-in to limit Actions costs.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[piast-ribbon-run]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install symbolic MIDI features and fixed evaluation libraries
        run: python -m pip install --quiet 'mido>=1.3,<2' 'partitura>=1.8,<2' 'music21>=9,<12' 'melody-features==1.3.3' 'scikit-learn>=1.5,<2'
      - name: Validate exact ablation protocol and regression tests
        run: python -m unittest discover -s tests -p 'test*tonal*.py' -v && python -m unittest discover -s tests -p 'test*piast_ribbon*.py' -v
      - name: Download exact pinned 1900 MIDI, no audio
        run: python -m scripts.fetch_piast_at "$RUNNER_TEMP/piast" --limit 1900 --workers 6 > "$RUNNER_TEMP/piast-fetch-log.json"
      - name: Reject incomplete PIAST cohort
        run: |
          python -c 'import json,os,pathlib; d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"piast"/"fetch-manifest.json").read_text()); assert d["requested"] == d["downloaded_or_present"] == 1900 and not d["errors"], "Incomplete MIDI cohort"'
      - name: Original Partitura tension ribbons vs strong static control and sham
        run: python -m scripts.piast_ribbon_experiment "$RUNNER_TEMP/piast" --out "$RUNNER_TEMP/ribbons"
      - name: Archive metrics only, never copyrighted MIDI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piast-ribbon-derived-metrics
          path: |
            ${{ runner.temp }}/ribbons/*.json
            ${{ runner.temp }}/ribbons/*.md
            ${{ runner.temp }}/piast-fetch-log.json
          retention-days: 14
