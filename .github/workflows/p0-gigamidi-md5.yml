name: P0 - empreinte MD5 GigaMIDI

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/p0-gigamidi-md5.yml
      - scripts/probe_gigamidi_md5.py
      - tests/test_probe_gigamidi_md5.py

permissions:
  contents: read

jobs:
  md5:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Tests sans reseau
        run: python -m unittest discover -s tests -v
      - name: Comparer trois empreintes sans conserver de musique
        env:
          HF_TOKEN: ${{ secrets.HUGGING_FACE_KEY }}
        run: python scripts/probe_gigamidi_md5.py
