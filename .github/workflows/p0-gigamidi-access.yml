name: P0 - verifier acces GigaMIDI

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/p0-gigamidi-access.yml
      - scripts/probe_gigamidi_access.py
      - tests/test_probe_gigamidi_access.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Tests sans reseau
        run: python -m unittest discover -s tests -v
      - name: Verifier le fichier Parquet sans telechargement
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/probe_gigamidi_access.py
