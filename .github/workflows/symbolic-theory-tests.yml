name: AnaMu - tests du noyau symbolique

on:
  workflow_dispatch:
    inputs:
      jsymbolic_smoke:
        description: 'Tester le vrai jSymbolic Java 2.2 sur un MIDI synthetique'
        required: false
        default: false
        type: boolean
  push:
    paths:
      - 'anamu/**'
      - 'tests/test_symbolic_expectation.py'
      - 'tests/test_emotion_research.py'
      - 'tests/test_melody_toolbox.py'
      - 'tests/test_jsymbolic_ace.py'
      - 'tests/test_idyom_guardrails.py'
      - 'scripts/emopia_benchmark.py'
      - 'scripts/run_original_idyom.py'
      - 'scripts/extract_tonal_tension.py'
      - 'scripts/extract_harmony.py'
      - 'scripts/extract_melody_features.py'
      - 'scripts/run_jsymbolic.py'
      - 'scripts/jsymbolic_smoke.py'
      - '.github/workflows/symbolic-theory-tests.yml'

permissions:
  contents: read

jobs:
  symbolic-theory-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Installer les outils de theorie musicale existants
        run: python -m pip install --quiet 'mido>=1.3,<2' 'partitura>=1.8,<2' 'music21>=9,<12' 'melody-features==1.3.3'
      - name: Tester le noyau symbolique
        run: python -m unittest discover -s tests -p 'test_symbolic_expectation.py' -v
      - name: Tester EMOPIA et les moteurs academiques reels sur MIDI fictifs
        run: python -m unittest discover -s tests -p 'test_emotion_research.py' -v
      - name: Tester la boite a outils melodiques et la chronologie Narmour
        run: python -m unittest discover -s tests -p 'test_melody_toolbox.py' -v
      - name: Tester les sorties ACE du moteur Java et les gardes anti-fuite IDyOM
        run: |
          python -m unittest discover -s tests -p 'test_jsymbolic_ace.py' -v
          python -m unittest discover -s tests -p 'test_idyom_guardrails.py' -v

  jsymbolic-upstream-smoke:
    # Same normal workflow; no costly Java download in routine test runs.
    # Opt in manually, or exactly once by marking a commit [jsymbolic-smoke].
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.jsymbolic_smoke) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[jsymbolic-smoke]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Installer le lecteur MIDI (aucun corpus distant)
        run: python -m pip install --quiet 'mido>=1.3,<2'
      - name: Telecharger et verifier jSymbolic original 2.2
        shell: bash
        run: |
          curl --fail --location --retry 2 --max-time 90 --output "$RUNNER_TEMP/jsymbolic-2.2.zip" 'https://sourceforge.net/projects/jmir/files/jSymbolic/jSymbolic%202.2/jSymbolic_2_2_user.zip/download'
          printf 'e1686a6bb1133cc21fb4678185d81e5e0a322b371ac713cbaf5fd9b69e2396cb  %s\n' "$RUNNER_TEMP/jsymbolic-2.2.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/jsymbolic-2.2"
          unzip -q "$RUNNER_TEMP/jsymbolic-2.2.zip" -d "$RUNNER_TEMP/jsymbolic-2.2"
      - name: Executer Java reel et lire ses sorties ACE temporelles
        run: python -m scripts.jsymbolic_smoke --distribution "$RUNNER_TEMP/jsymbolic-2.2" --out "$RUNNER_TEMP/anamu-jsymbolic-smoke"
      - uses: actions/upload-artifact@v4
        with:
          name: jsymbolic-original-smoke-summary
          path: ${{ runner.temp }}/anamu-jsymbolic-smoke/smoke_summary.json
          retention-days: 7
