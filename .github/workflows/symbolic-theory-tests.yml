name: AnaMu - composants musicaux réutilisables

on:
  push:
    paths:
      - 'anamu/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/symbolic-theory-tests.yml'
  pull_request:
    paths:
      - 'anamu/**'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/symbolic-theory-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  theory-primitives:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Installer les dépendances des composants musicologiques
        run: python -m pip install --quiet 'mido>=1.3,<2' 'partitura>=1.8,<2' 'music21>=9,<12' 'melody-features==1.3.3' 'scikit-learn>=1.5,<2'
      - name: Tester la grammaire et les composants scientifiques conservés
        run: python -m unittest discover -s tests -p 'test_*.py' -v
