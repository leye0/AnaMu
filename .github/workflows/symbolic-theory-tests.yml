name: AnaMu - tests du noyau symbolique

on:
  workflow_dispatch:
    inputs:
      jsymbolic_smoke:
        description: 'Tester le vrai jSymbolic Java 2.2 sur un MIDI synthetique'
        required: false
        default: false
        type: boolean
      vgmidi_temporal:
        description: 'Comparer humains vs analyse AnaMu sur 10 themes connus reserves au test'
        required: false
        default: false
        type: boolean
      classics_analysis:
        description: 'Analyser cinq compositions classiques avec le modele sauvegarde et jSymbolic original'
        required: false
        default: false
        type: boolean
  push:
    paths:
      - 'anamu/**'
      - 'tests/test_symbolic_expectation.py'
      - 'tests/test_piast_expectation_hypothesis.py'
      - 'tests/test_piast_tension_hypothesis.py'
      - 'tests/test_piast_at.py'
      - 'tests/test_emotion_research.py'
      - 'tests/test_melody_toolbox.py'
      - 'tests/test_jsymbolic_ace.py'
      - 'tests/test_idyom_guardrails.py'
      - 'tests/test_idyom_dat.py'
      - 'tests/test_vgmidi_temporal.py'
      - 'tests/test_academic_fusion.py'
      - 'tests/test_emotion_models.py'
      - 'tests/test_emotion_pipeline.py'
      - 'tests/test_relative_emotion_benchmarks.py'
      - 'scripts/emopia_benchmark.py'
      - 'scripts/piast_at_benchmark.py'
      - 'scripts/piast_surprise_experiment.py'
      - 'scripts/piast_tension_experiment.py'
      - 'scripts/isovat_tension_benchmark.py'
      - 'scripts/cp_wtc_relative_benchmark.py'
      - 'scripts/percepiano_hard_benchmark.py'
      - 'scripts/percepiano_pulse_hypothesis.py'
      - 'scripts/run_original_idyom.py'
      - 'scripts/import_idyom_dat.py'
      - 'scripts/extract_tonal_tension.py'
      - 'scripts/extract_harmony.py'
      - 'scripts/extract_melody_features.py'
      - 'scripts/run_jsymbolic.py'
      - 'scripts/jsymbolic_smoke.py'
      - 'scripts/fetch_vgmidi_temporal.py'
      - 'scripts/vgmidi_temporal_benchmark.py'
      - 'scripts/batch_jsymbolic_vgmidi.py'
      - 'scripts/analyze_known_midi.py'
      - 'scripts/analyze_known_scores.py'
      - 'scripts/plot_known_emotions.py'
      - 'scripts/report_known_emotions.py'
      - 'scripts/trace_known_mechanisms.py'
      - 'scripts/plot_vgmidi_temporal.py'
      - '.github/workflows/symbolic-theory-tests.yml'

permissions:
  contents: read

jobs:
  symbolic-theory-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Installer les outils de theorie musicale existants
        run: python -m pip install --quiet 'mido>=1.3,<2' 'partitura>=1.8,<2' 'music21>=9,<12' 'melody-features==1.3.3' 'scikit-learn>=1.5,<2'
      - name: Tester le noyau symbolique
        run: python -m unittest discover -s tests -p 'test_symbolic_expectation.py' -v
      - name: Verifier les hypotheses de surprise MIDI et les plis anti-fuite
        run: python -m unittest discover -s tests -p 'test_piast_expectation_hypothesis.py' -v
      - name: Verifier le cumul de tension, la relaxation et les mesures melangees
        run: python -m unittest discover -s tests -p 'test_piast_tension_hypothesis.py' -v
      - name: Verifier les metriques multi-etiquettes PIAST et l'audit des erreurs
        run: python -m unittest discover -s tests -p 'test_piast_at.py' -v
      - name: Tester EMOPIA et les moteurs academiques reels sur MIDI fictifs
        run: python -m unittest discover -s tests -p 'test_emotion_research.py' -v
      - name: Tester la boite a outils melodiques et la chronologie Narmour
        run: python -m unittest discover -s tests -p 'test_melody_toolbox.py' -v
      - name: Tester les sorties ACE du moteur Java et les gardes anti-fuite IDyOM
        run: |
          python -m unittest discover -s tests -p 'test_jsymbolic_ace.py' -v
          python -m unittest discover -s tests -p 'test_idyom_guardrails.py' -v
          python -m unittest discover -s tests -p 'test_idyom_dat.py' -v
          python -m unittest discover -s tests -p 'test_vgmidi_temporal.py' -v
          python -m unittest discover -s tests -p 'test_academic_fusion.py' -v
          python -m unittest discover -s tests -p 'test_emotion_models.py' -v
          python -m unittest discover -s tests -p 'test_emotion_pipeline.py' -v
          python -m unittest discover -s tests -p 'test_relative_emotion_benchmarks.py' -v

  vgmidi-human-comparison:
    # Research run on 200 copyright-sensitive third-party MIDI files, opt-in
    # only. Report artifacts contain derived scores, NEVER the source MIDI.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.vgmidi_temporal) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[vgmidi-run]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Installer les moteurs symboliques et le controle de prediction
        run: python -m pip install --quiet 'mido>=1.3,<2' 'partitura>=1.8,<2' 'music21>=9,<12' 'melody-features==1.3.3' 'scikit-learn>=1.5,<2'
      - name: Recuperer seulement 200 MIDI VGMIDI du commit auteur fixe et ses votes
        run: python -m scripts.fetch_vgmidi_temporal "$RUNNER_TEMP/anamu-vgmidi"
      - name: Restaurer le jSymbolic officiel deja valide
        id: restore-jsymbolic-vgmidi
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/jsymbolic-2.2.zip
          key: jsymbolic-stable-2.2-e1686a6bb1133cc21fb4678185d81e5e0a322b371ac713cbaf5fd9b69e2396cb
      - name: Verifier le code Java original et ses dependances
        run: |
          if [ ! -f "$RUNNER_TEMP/jsymbolic-2.2.zip" ]; then
            curl --fail --location --silent --show-error --retry 0 --max-time 600 --output "$RUNNER_TEMP/jsymbolic-2.2.zip" 'https://sourceforge.net/projects/jmir/files/jSymbolic/jSymbolic%202.2/jSymbolic_2_2_user.zip/download'
          fi
          printf 'e1686a6bb1133cc21fb4678185d81e5e0a322b371ac713cbaf5fd9b69e2396cb  %s\n' "$RUNNER_TEMP/jsymbolic-2.2.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/jsymbolic-2.2"
          unzip -q "$RUNNER_TEMP/jsymbolic-2.2.zip" -d "$RUNNER_TEMP/jsymbolic-2.2"
      - name: Extraire les fenetres temporelles du vrai jSymbolic sur les MIDI admissibles
        run: |
          python -m scripts.batch_jsymbolic_vgmidi "$RUNNER_TEMP/anamu-vgmidi" --jar "$RUNNER_TEMP/jsymbolic-2.2/jSymbolic_2_2_user/jSymbolic2.jar" --out "$RUNNER_TEMP/anamu-jsymbolic-vgmidi" --window-seconds 10 --batch-size 25
      - name: Analyser les emotions de 10 themes connus avec tous les moteurs disponibles
        run: |
          mkdir -p "$RUNNER_TEMP/anamu-vgmidi-report"
          python -m scripts.vgmidi_temporal_benchmark "$RUNNER_TEMP/anamu-vgmidi" --jsymbolic-ace "$RUNNER_TEMP/anamu-jsymbolic-vgmidi" --model-out "$RUNNER_TEMP/anamu-vgmidi-report/calibrated-model.json" --json-out "$RUNNER_TEMP/anamu-vgmidi-report/ten.json" --markdown-out "$RUNNER_TEMP/anamu-vgmidi-report/ten.md"
          python -m scripts.plot_vgmidi_temporal "$RUNNER_TEMP/anamu-vgmidi-report/ten.json" "$RUNNER_TEMP/anamu-vgmidi-report/ten.svg"
      - name: Utiliser le modele sauvegarde sur un morceau connu sans ses annotations
        run: |
          python -m scripts.analyze_known_midi --model "$RUNNER_TEMP/anamu-vgmidi-report/calibrated-model.json" --jsymbolic-ace "$RUNNER_TEMP/anamu-jsymbolic-vgmidi" --measure-count 136 --json-out "$RUNNER_TEMP/anamu-vgmidi-report/chrono-standalone.json" "$RUNNER_TEMP/anamu-vgmidi/midi/Chrono_SNES_Chrono Trigger_Chrono Trigger.mid"
      - name: Analyser aussi des oeuvres classiques connues de Bach et Chopin
        run: |
          python -m scripts.analyze_known_scores --model "$RUNNER_TEMP/anamu-vgmidi-report/calibrated-model.json" --jsymbolic-jar "$RUNNER_TEMP/jsymbolic-2.2/jSymbolic_2_2_user/jSymbolic2.jar" --out "$RUNNER_TEMP/anamu-classics"
          cp "$RUNNER_TEMP/anamu-classics/bach-chopin-emotions.json" "$RUNNER_TEMP/anamu-vgmidi-report/bach-chopin-emotions.json"
          python -m scripts.plot_known_emotions "$RUNNER_TEMP/anamu-vgmidi-report/bach-chopin-emotions.json" "$RUNNER_TEMP/anamu-vgmidi-report/bach-chopin-emotions.svg"
          python -m scripts.report_known_emotions "$RUNNER_TEMP/anamu-vgmidi-report/bach-chopin-emotions.json" "$RUNNER_TEMP/anamu-vgmidi-report/bach-chopin-emotions.md"
      - uses: actions/upload-artifact@v4
        with:
          name: vgmidi-10-human-vs-anamu
          path: ${{ runner.temp }}/anamu-vgmidi-report/
          retention-days: 14

  jsymbolic-upstream-smoke:
    # Same normal workflow; no costly Java download in routine test runs.
    # Opt in manually, or exactly once by marking a commit [jsymbolic-smoke].
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.jsymbolic_smoke) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[jsymbolic-smoke]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Installer le lecteur MIDI (aucun corpus distant)
        run: python -m pip install --quiet 'mido>=1.3,<2'
      - name: Restaurer le binaire jSymbolic officiel deja verifie
        id: cache-jsymbolic
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/jsymbolic-2.2.zip
          key: jsymbolic-stable-2.2-e1686a6bb1133cc21fb4678185d81e5e0a322b371ac713cbaf5fd9b69e2396cb
      - name: Telecharger et verifier jSymbolic original 2.2
        shell: bash
        run: |
          # Official SourceForge transfer is heavily throttled (~17 MB in 310 s
          # on the previous run); use a single longer bounded transfer. SHA-256
          # is mandatory; a partial or HTML response can never be executed.
          if [ ! -f "$RUNNER_TEMP/jsymbolic-2.2.zip" ]; then
            curl --fail --location --silent --show-error --retry 0 --max-time 600 --output "$RUNNER_TEMP/jsymbolic-2.2.zip" 'https://sourceforge.net/projects/jmir/files/jSymbolic/jSymbolic%202.2/jSymbolic_2_2_user.zip/download'
          fi
          printf 'e1686a6bb1133cc21fb4678185d81e5e0a322b371ac713cbaf5fd9b69e2396cb  %s\n' "$RUNNER_TEMP/jsymbolic-2.2.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/jsymbolic-2.2"
          unzip -q "$RUNNER_TEMP/jsymbolic-2.2.zip" -d "$RUNNER_TEMP/jsymbolic-2.2"
      - name: Mettre en cache l'archive controlee pour eviter de la retelecharger
        if: ${{ steps.cache-jsymbolic.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/jsymbolic-2.2.zip
          key: jsymbolic-stable-2.2-e1686a6bb1133cc21fb4678185d81e5e0a322b371ac713cbaf5fd9b69e2396cb
      - name: Executer Java reel et lire ses sorties ACE temporelles
        run: python -m scripts.jsymbolic_smoke --distribution "$RUNNER_TEMP/jsymbolic-2.2" --out "$RUNNER_TEMP/anamu-jsymbolic-smoke"
      - uses: actions/upload-artifact@v4
        with:
          name: jsymbolic-original-smoke-summary
          path: ${{ runner.temp }}/anamu-jsymbolic-smoke/smoke_summary.json
          retention-days: 7

  known-classics-analysis:
    # Analyse réelle des œuvres sans téléchargement/recalibration VGMIDI.
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.classics_analysis) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[classics-run]')) }}
    runs-on: ubuntu-latest
    # Protect the user's GitHub Actions minutes; an upstream Java stall is a
    # failed research experiment, not a reason to spend 25 CI minutes.
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Installer les moteurs symboliques existants
        run: python -m pip install --quiet 'mido>=1.3,<2' 'partitura>=1.8,<2' 'music21>=9,<12' 'melody-features==1.3.3' 'scikit-learn>=1.5,<2'
      - name: Restaurer le jSymbolic 2.2 original controle
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/jsymbolic-2.2.zip
          key: jsymbolic-stable-2.2-e1686a6bb1133cc21fb4678185d81e5e0a322b371ac713cbaf5fd9b69e2396cb
      - name: Verifier la provenance du binaire Java
        run: |
          if [ ! -f "$RUNNER_TEMP/jsymbolic-2.2.zip" ]; then
            curl --fail --location --silent --show-error --retry 0 --max-time 600 --output "$RUNNER_TEMP/jsymbolic-2.2.zip" 'https://sourceforge.net/projects/jmir/files/jSymbolic/jSymbolic%202.2/jSymbolic_2_2_user.zip/download'
          fi
          printf 'e1686a6bb1133cc21fb4678185d81e5e0a322b371ac713cbaf5fd9b69e2396cb  %s\n' "$RUNNER_TEMP/jsymbolic-2.2.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/jsymbolic-2.2"
          unzip -q "$RUNNER_TEMP/jsymbolic-2.2.zip" -d "$RUNNER_TEMP/jsymbolic-2.2"
      - name: Analyser cinq œuvres connues avec Java original ou extraits bornes
        run: |
          python -m scripts.analyze_known_scores --expanded --jsymbolic-jar "$RUNNER_TEMP/jsymbolic-2.2/jSymbolic_2_2_user/jSymbolic2.jar" --jsymbolic-timeout 45 --jsymbolic-fallback-window 30 --jsymbolic-fallback-timeout 45 --jsymbolic-segment-threshold 48 --jsymbolic-segment-measures 16 --jsymbolic-segment-timeout 20 --out "$RUNNER_TEMP/anamu-classics"
          python -m scripts.plot_known_emotions "$RUNNER_TEMP/anamu-classics/known-classics-emotions.json" "$RUNNER_TEMP/anamu-classics/known-classics-emotions.svg"
          python -m scripts.report_known_emotions "$RUNNER_TEMP/anamu-classics/known-classics-emotions.json" "$RUNNER_TEMP/anamu-classics/known-classics-emotions.md"
          python -m scripts.trace_known_mechanisms "$RUNNER_TEMP/anamu-classics/known-classics-emotions.json" --out "$RUNNER_TEMP/anamu-classics/known-classics-mechanisms.json"
      - uses: actions/upload-artifact@v4
        with:
          name: anamu-five-known-classics
          path: |
            ${{ runner.temp }}/anamu-classics/*.json
            ${{ runner.temp }}/anamu-classics/*.svg
            ${{ runner.temp }}/anamu-classics/*.md
          retention-days: 14
