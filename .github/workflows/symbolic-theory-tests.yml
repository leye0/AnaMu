name: AnaMu - tests du noyau symbolique

on:
  workflow_dispatch:
  push:
    paths:
      - 'anamu/**'
      - 'tests/test_symbolic_expectation.py'
      - '.github/workflows/symbolic-theory-tests.yml'

permissions:
  contents: read

jobs:
  symbolic-theory-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Installer le lecteur MIDI minimal
        run: python -m pip install --quiet 'mido>=1.3,<2'
      - name: Tester sans reseau ni telechargement de corpus
        run: python -m unittest tests.test_symbolic_expectation -v
