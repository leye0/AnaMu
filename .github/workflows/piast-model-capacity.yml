name: AnaMu - fixed nonlinear capacity on human votes (opt-in)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/piast-model-capacity.yml'
      - 'scripts/piast_model_capacity.py'
      - 'tests/test_piast_model_capacity.py'
      - 'data/piast-capacity-folds-v1.json'

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet 'mido>=1.3,<2' 'scikit-learn==1.8.0'
      - run: python -m unittest discover -s tests -p 'test_piast_model_capacity.py' -v
  capacity:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[piast-capacity-run]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install MIDI and statistical dependencies
        run: python -m pip install --quiet 'mido>=1.3,<2' 'scikit-learn==1.8.0'
      - name: Check vote contract
        run: python -m unittest discover -s tests -p 'test_piast_model_capacity.py' -v
      - name: Fetch pinned cohort
        run: python -m scripts.fetch_piast_at "$RUNNER_TEMP/piast" --limit 1900 --workers 12 > "$RUNNER_TEMP/fetch.log"
      - name: Require complete corpus
        run: |
          python -c 'import json,os,pathlib; d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"piast"/"fetch-manifest.json").read_text()); assert d["requested"] == d["downloaded_or_present"] == 1900 and not d["errors"]'
      - name: Compare fixed models on identical source-disjoint folds
        run: python -m scripts.piast_model_capacity "$RUNNER_TEMP/piast" --out "$RUNNER_TEMP/capacity"
      - name: Save derived results without raw MIDI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piast-model-capacity
          path: |
            ${{ runner.temp }}/capacity/*.json
            ${{ runner.temp }}/capacity/*.md
            ${{ runner.temp }}/fetch.log
          retention-days: 14
