name: AnaMu - inspect independent EMOPIA 2.2 vote schemas (opt-in)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/emopia-annotation-inspection.yml'
      - 'scripts/inspect_emopia_votes.py'

permissions:
  contents: read

jobs:
  metadata-only:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[emopia-inspect-run]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify inspector rejects absent MIDI without external access
        run: python -m unittest tests.test_inspect_emopia_votes -v
      - name: Inspect published 32-MB Zenodo archive in memory
        run: python -m scripts.inspect_emopia_votes --out "$RUNNER_TEMP/emopia-schema-summary.json"
      - name: Save derived schema counts only, not archive or original annotations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emopia-annotation-schema-only
          path: ${{ runner.temp }}/emopia-schema-summary.json
          retention-days: 14
