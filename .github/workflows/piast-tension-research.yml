name: AnaMu - PIAST-AT hard moods and temporal tension (opt-in)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/piast-tension-research.yml'
      - 'anamu/piast_tension_hypothesis.py'
      - 'scripts/piast_tension_experiment.py'

permissions:
  contents: read

jobs:
  tension-hard-moods:
    # Explicit commit tag required; no costly download on routine edits.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[piast-tension-run]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install MIDI-only research dependencies
        run: python -m pip install --quiet 'mido>=1.3,<2' 'partitura>=1.8,<2' 'music21>=9,<12' 'melody-features==1.3.3' 'scikit-learn>=1.5,<2'
      - name: Check physical trends, memory and deterministic order controls
        run: |
          python -m unittest discover -s tests -p 'test_piast_tension_hypothesis.py' -v
          python -m unittest discover -s tests -p 'test_piast_expectation_hypothesis.py' -v
      - name: Download all exactly matched PIAST-AT piano MIDI from pinned revision
        run: python -m scripts.fetch_piast_at "$RUNNER_TEMP/piast" --limit 1900 --workers 6 > "$RUNNER_TEMP/piast-fetch-log.json"
      - name: Enforce complete cohort before reporting scores
        run: |
          python -c 'import json,os,pathlib; d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"piast"/"fetch-manifest.json").read_text()); assert d["requested"] == d["downloaded_or_present"] == 1900 and not d["errors"], "Incomplete pinned dataset"'
      - name: Five fixed variants; focus on five hard moods and fourteen non-calm moods
        run: python -m scripts.piast_tension_experiment "$RUNNER_TEMP/piast" --limit 1900 --fresh-after 1400 --out "$RUNNER_TEMP/piast-hard"
      - name: Preserve derived scores only, never source MIDI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piast-hard-moods-tension-ablation
          path: |
            ${{ runner.temp }}/piast-hard/*.json
            ${{ runner.temp }}/piast-hard/*.md
            ${{ runner.temp }}/piast-fetch-log.json
          retention-days: 14
