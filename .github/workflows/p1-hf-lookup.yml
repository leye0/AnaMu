name: P1 - recherche MD5 indexee Hugging Face

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/p1-hf-lookup.yml
      - scripts/probe_hf_lookup.py
      - tests/test_probe_hf_lookup.py

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Tests sans reseau
        run: python -m unittest discover -s tests -v
      - name: Tester les capacites du viewer et la recherche indexee
        env:
          HF_TOKEN: ${{ secrets.HUGGING_FACE_KEY }}
        run: python scripts/probe_hf_lookup.py
