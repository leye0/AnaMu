name: P1 - lecture colonne MD5 sans MIDI

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/p1-parquet-columns.yml
      - scripts/probe_hf_parquet_columns.py
      - tests/test_probe_hf_parquet_columns.py

permissions:
  contents: read

jobs:
  parquet:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Tests sans reseau
        run: python -m unittest discover -s tests -v
      - name: Installer uniquement les lecteurs Parquet et Hugging Face
        run: python -m pip install --quiet 'pyarrow>=17,<27' 'huggingface_hub>=0.35,<3'
      - name: Lire une seule colonne et un seul groupe Parquet
        env:
          HF_TOKEN: ${{ secrets.HUGGING_FACE_KEY }}
        run: python scripts/probe_hf_parquet_columns.py
