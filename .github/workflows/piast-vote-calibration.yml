name: AnaMu - PIAST expert vote probability calibration (opt-in)

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/piast-vote-calibration.yml'
      - 'scripts/piast_vote_calibration.py'

permissions:
  contents: read

jobs:
  probability-calibration:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[piast-calibration-run]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install fixed MIDI features and scikit-learn
        run: python -m pip install --quiet 'mido>=1.3,<2' 'partitura>=1.8,<2' 'music21>=9,<12' 'melody-features==1.3.3' 'scikit-learn>=1.5,<2'
      - name: Verify expected fractional Bernoulli Brier and fixed prior correction
        run: python -m unittest discover -s tests -p 'test*piast_vote_calibration*.py' -v
      - name: Fetch exact pinned PIAST 1900 MIDI cohort
        run: python -m scripts.fetch_piast_at "$RUNNER_TEMP/piast" --limit 1900 --workers 6 > "$RUNNER_TEMP/piast-fetch-log.json"
      - name: Refuse incomplete corpus
        run: |
          python -c 'import json,os,pathlib; d=json.loads((pathlib.Path(os.environ["RUNNER_TEMP"])/"piast"/"fetch-manifest.json").read_text()); assert d["requested"] == d["downloaded_or_present"] == 1900 and not d["errors"], "Incomplete MIDI cohort"'
      - name: Quantify ranking and calibration for all hard human moods
        run: python -m scripts.piast_vote_calibration "$RUNNER_TEMP/piast" --out "$RUNNER_TEMP/calibration"
      - name: Save derived scores only, never the MIDI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piast-vote-calibration-derived-scores
          path: |
            ${{ runner.temp }}/calibration/*.json
            ${{ runner.temp }}/calibration/*.md
            ${{ runner.temp }}/piast-fetch-log.json
          retention-days: 14
