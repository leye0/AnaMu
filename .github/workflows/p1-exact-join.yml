name: P1 - correspondance XMIDI GigaMIDI (MD5 exact)

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/p1-exact-join.yml

permissions:
  contents: read

jobs:
  exact-join:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Tests locaux sans reseau
        run: python -m unittest discover -s tests -v
      - name: Installer uniquement les lecteurs Parquet et Hugging Face
        run: python -m pip install --quiet 'pyarrow>=17,<27' 'huggingface_hub>=0.35,<3'
      - name: Echantillon XMIDI et balayage MD5 d'un seul shard GigaMIDI
        env:
          HF_TOKEN: ${{ secrets.HUGGING_FACE_KEY }}
        run: python -m scripts.pilot_exact_join
